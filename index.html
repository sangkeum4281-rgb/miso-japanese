<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🌸 미소의 일본어 단어장</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #fce4ec 100%);
            min-height: 100vh;
            color: #333;
        }

        .app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: white;
            box-shadow: 0 0 40px rgba(255, 105, 135, 0.15);
        }

        .header {
            background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
        }
        .header-text h1 { font-size: 20px; font-weight: 700; }
        .header-text p  { font-size: 11px; opacity: 0.85; margin-top: 2px; }
        .header-ganadi  { flex-shrink: 0; }

        .nav {
            display: flex;
            background: white;
            border-bottom: 1px solid #fce4ec;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-btn {
            flex: 1;
            padding: 11px 4px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 10px;
            color: #bbb;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: color 0.2s;
            border-bottom: 2px solid transparent;
        }
        .nav-btn span:first-child { font-size: 20px; }
        .nav-btn.active { color: #ff6b9d; border-bottom-color: #ff6b9d; }

        .page { display: none; padding: 20px; min-height: calc(100vh - 120px); }
        .page.active { display: block; }

        /* Word list */
        .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .filter-btn {
            padding: 7px 16px;
            border-radius: 20px;
            border: 1.5px solid #fce4ec;
            background: white;
            cursor: pointer;
            font-size: 13px;
            color: #aaa;
            transition: all 0.2s;
        }
        .filter-btn.active { background: #ff6b9d; border-color: #ff6b9d; color: white; }

        .word-count { font-size: 13px; color: #bbb; margin-bottom: 14px; }

        .word-card {
            background: white;
            border: 1.5px solid #fce4ec;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: opacity 0.2s;
        }
        .word-card.memorized { opacity: 0.45; background: #fafafa; }
        .word-info { flex: 1; min-width: 0; }
        .word-furigana { font-size: 11px; color: #ff6b9d; margin-bottom: 2px; }
        .word-japanese { font-size: 22px; font-weight: 700; color: #222; }
        .word-korean { font-size: 14px; color: #888; margin-top: 2px; }
        .word-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .btn-icon {
            width: 36px; height: 36px; border-radius: 50%;
            border: none; cursor: pointer; font-size: 15px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .btn-check { background: #e8f5e9; color: #4caf50; }
        .btn-check.checked { background: #4caf50; color: white; }
        .btn-delete { background: #fce4ec; color: #f06292; }

        /* Add form */
        .section-title { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 16px; }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: #ff6b9d; margin-bottom: 7px; }
        .form-input {
            width: 100%; padding: 14px; border: 1.5px solid #fce4ec;
            border-radius: 12px; font-size: 16px; outline: none;
            transition: border-color 0.2s; font-family: inherit;
        }
        .form-input:focus { border-color: #ff6b9d; }
        .btn-primary {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #ff6b9d, #ff8fab);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer;
            transition: opacity 0.2s; font-family: inherit;
        }
        .btn-primary:active { opacity: 0.85; }
        .divider { border: none; border-top: 1.5px solid #fce4ec; margin: 24px 0; }

        /* Flashcard */
        .progress-bar { background: #fce4ec; border-radius: 10px; height: 7px; margin-bottom: 18px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ff6b9d, #ff8fab); border-radius: 10px; transition: width 0.4s; }
        .counter-text { text-align: center; color: #bbb; font-size: 13px; margin-bottom: 10px; }

        .flashcard {
            background: linear-gradient(135deg, #fff0f5, #fce4ec);
            border: 2px solid #ffb3c6;
            border-radius: 22px;
            padding: 44px 24px;
            text-align: center;
            min-height: 210px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer;
            margin-bottom: 18px;
            user-select: none;
        }
        .card-furigana { font-size: 14px; color: #ff6b9d; min-height: 20px; margin-bottom: 6px; }
        .card-japanese { font-size: 40px; font-weight: 700; color: #222; margin-bottom: 12px; }
        .card-korean { font-size: 20px; color: #666; min-height: 28px; }

        .card-buttons { display: flex; gap: 12px; margin-bottom: 12px; }
        .btn-secondary {
            flex: 1; padding: 14px; border-radius: 12px; border: none;
            cursor: pointer; font-size: 15px; font-weight: 600;
            font-family: inherit; transition: opacity 0.2s;
        }
        .btn-secondary:active { opacity: 0.8; }

        /* Quiz */
        .quiz-question {
            background: linear-gradient(135deg, #fff0f5, #fce4ec);
            border-radius: 20px; padding: 30px 20px;
            text-align: center; margin-bottom: 18px;
        }
        .quiz-word { font-size: 36px; font-weight: 700; color: #222; margin-bottom: 6px; }
        .quiz-furigana { font-size: 13px; color: #ff6b9d; }
        .quiz-sub { font-size: 13px; color: #bbb; margin-top: 10px; }

        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
        .quiz-option {
            padding: 18px 10px; background: white;
            border: 2px solid #fce4ec; border-radius: 14px;
            cursor: pointer; font-size: 15px; text-align: center;
            transition: all 0.2s; font-family: inherit; color: #333;
        }
        .quiz-option.correct { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
        .quiz-option.wrong   { background: #fce4ec; border-color: #f06292; color: #c62828; }
        .quiz-option:disabled { cursor: default; }
        .score-display { text-align: center; font-size: 16px; color: #ff6b9d; font-weight: 700; margin-bottom: 14px; }

        /* Quiz result */
        .quiz-result { text-align: center; padding: 24px 10px; }
        .result-score { font-size: 56px; font-weight: 700; color: #ff6b9d; margin-bottom: 4px; }
        .result-fraction { font-size: 20px; color: #ff6b9d; font-weight: 600; margin-bottom: 10px; }
        .result-message { font-size: 17px; color: #666; margin-bottom: 26px; line-height: 1.6; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #fff0f5, #fce4ec); border-radius: 16px; padding: 20px; text-align: center; }
        .stat-number { font-size: 34px; font-weight: 700; color: #ff6b9d; }
        .stat-label  { font-size: 12px; color: #aaa; margin-top: 4px; }

        /* Empty state */
        .empty-state { text-align: center; padding: 60px 20px; color: #ccc; }
        .empty-state .emoji { font-size: 64px; margin-bottom: 14px; }
        .empty-state p { font-size: 16px; line-height: 1.6; }

        /* Letter chat */
        #page-letter { display: none; flex-direction: column; padding: 16px 16px 0; }
        #page-letter.active { display: flex; }
        #letter-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }

        .bubble-wrap { display: flex; margin-bottom: 12px; gap: 8px; }
        .bubble-wrap.me   { flex-direction: row-reverse; }
        .bubble-wrap.miso { flex-direction: row; }

        .bubble-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; align-self: flex-end; }
        .bubble-content { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
        .bubble-wrap.me   .bubble-content { align-items: flex-end; }
        .bubble-wrap.miso .bubble-content { align-items: flex-start; }

        .bubble-name { font-size: 11px; color: #bbb; }
        .bubble {
            padding: 11px 14px; border-radius: 18px;
            font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-all;
        }
        .bubble-wrap.me   .bubble { background: #ff6b9d; color: white; border-bottom-right-radius: 4px; }
        .bubble-wrap.miso .bubble { background: #f5f5f5; color: #333; border-bottom-left-radius: 4px; }
        .bubble-time { font-size: 10px; color: #ccc; }
        .bubble-del { background: none; border: none; font-size: 12px; color: #ddd; cursor: pointer; padding: 0 2px; }

        /* Confetti */
        .confetti-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
        .confetti { position: absolute; animation: confetti-fall linear forwards; }
        @keyframes confetti-fall { to { transform: translateY(105vh) rotate(720deg); opacity: 0; } }

        /* ── 가나디 팝업 ─────────────────────────── */
        .ganadi-popup {
            position: fixed;
            bottom: 80px;
            right: 16px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            transform: translateY(200px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            pointer-events: none;
        }
        .ganadi-popup.show {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .ganadi-bubble {
            background: white;
            border: 2px solid #ffb3c6;
            border-radius: 16px 16px 4px 16px;
            padding: 10px 14px;
            font-size: 13px;
            color: #555;
            max-width: 180px;
            line-height: 1.5;
            text-align: center;
            box-shadow: 0 4px 16px rgba(255,107,157,0.15);
        }
        .ganadi-tap-hint {
            font-size: 10px;
            color: #ddd;
            text-align: center;
        }

        /* 가나디 SVG 스타일 */
        .ganadi-svg-wrap { cursor: pointer; }
        .ganadi-svg-wrap:active { transform: scale(0.92); }
        .ganadi-bounce { animation: ganadiBounce 0.6s ease infinite alternate; }
        @keyframes ganadiBounce {
            from { transform: translateY(0); }
            to   { transform: translateY(-6px); }
        }

        /* 퀴즈 결과 안 가나디 */
        .result-ganadi { display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; }

        .mt-12 { margin-top: 12px; }


    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="header-ganadi" id="header-ganadi-wrap"></div>
        <div class="header-text">
            <h1>미소의 일본어 단어장 🌸</h1>
            <p>김미소는 꿀돼지라네</p>
        </div>
    </div>

    <nav class="nav">
        <button class="nav-btn active" data-page="wordlist" onclick="showPage('wordlist',this)"><span>📖</span><span>단어장</span></button>
        <button class="nav-btn" data-page="add"      onclick="showPage('add',this)">     <span>➕</span><span>추가</span></button>
        <button class="nav-btn" data-page="study"    onclick="showPage('study',this)">   <span>📚</span><span>학습</span></button>
        <button class="nav-btn" data-page="quiz"     onclick="showPage('quiz',this)">    <span>🎯</span><span>퀴즈</span></button>
        <button class="nav-btn" data-page="stats"    onclick="showPage('stats',this)">   <span>📊</span><span>통계</span></button>
        <button class="nav-btn" data-page="letter"   onclick="showPage('letter',this)">  <span>💌</span><span>편지</span></button>
    </nav>

    <!-- 단어장 -->
    <div id="page-wordlist" class="page active">
        <div class="filter-row">
            <button class="filter-btn active" onclick="setFilter('all',this)">전체</button>
            <button class="filter-btn" onclick="setFilter('active',this)">학습중</button>
            <button class="filter-btn" onclick="setFilter('memorized',this)">암기완료</button>
        </div>
        <div id="word-count" class="word-count"></div>
        <div id="word-list"></div>
    </div>

    <!-- 단어 추가 -->
    <div id="page-add" class="page">
        <div class="section-title">새 단어 추가 ✏️</div>
        <div class="form-group">
            <label class="form-label">일본어 단어 *</label>
            <input class="form-input" id="input-japanese" type="text" placeholder="예) 猫  /  ねこ" autocomplete="off" autocorrect="off">
        </div>
        <div class="form-group">
            <label class="form-label">후리가나 (읽는 법)</label>
            <input class="form-input" id="input-furigana" type="text" placeholder="예) ねこ" autocomplete="off" autocorrect="off">
        </div>
        <div class="form-group">
            <label class="form-label">한국어 뜻 *</label>
            <input class="form-input" id="input-korean" type="text" placeholder="예) 고양이" autocomplete="off">
        </div>
        <button class="btn-primary" id="btn-add-word" onclick="addWord()">✨ 단어 추가하기</button>
        <hr class="divider">
        <div class="section-title">여러 단어 한번에 추가 📋</div>
        <div class="form-group">
            <label class="form-label">일본어, 후리가나, 뜻  (한 줄에 하나씩)</label>
            <textarea class="form-input" id="input-bulk" rows="7"
                placeholder="猫,ねこ,고양이&#10;犬,いぬ,개&#10;花,はな,꽃&#10;&#10;후리가나 없으면:  단어,뜻" style="resize:vertical;font-size:14px;line-height:1.7;"></textarea>
        </div>
        <button class="btn-primary" onclick="bulkAddWords()" style="background:linear-gradient(135deg,#a78bfa,#c084fc);">📋 일괄 추가하기</button>
    </div>

    <!-- 학습 (플래시카드) -->
    <div id="page-study" class="page">
        <div id="study-content"></div>
    </div>

    <!-- 퀴즈 -->
    <div id="page-quiz" class="page">
        <div id="quiz-content"></div>
    </div>

    <!-- 통계 -->
    <div id="page-stats" class="page">
        <div class="section-title">나의 학습 현황 🌸</div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="stat-total">0</div><div class="stat-label">전체 단어</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-memorized">0</div><div class="stat-label">암기 완료</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-quizzes">0</div><div class="stat-label">퀴즈 횟수</div></div>
            <div class="stat-card"><div class="stat-number" id="stat-best">0%</div><div class="stat-label">최고 점수</div></div>
        </div>
        <div style="background:linear-gradient(135deg,#fff0f5,#fce4ec);border-radius:16px;padding:20px;margin-bottom:20px;">
            <div style="font-size:14px;color:#888;margin-bottom:10px;">암기 진행률</div>
            <div class="progress-bar" style="height:12px;margin-bottom:8px;">
                <div class="progress-fill" id="stat-progress" style="width:0%"></div>
            </div>
            <div style="font-size:13px;color:#ff6b9d;font-weight:700;" id="stat-progress-text">0 / 0</div>
        </div>
        <button class="btn-primary" onclick="resetStats()" style="background:linear-gradient(135deg,#bbb,#ccc);">통계 초기화</button>
    </div>

    <!-- 편지함 -->
    <div id="page-letter" class="page">
        <div id="letter-list" style="margin-bottom:16px;"></div>
        <div style="background:white;border-top:1.5px solid #fce4ec;padding-top:14px;">
            <div style="display:flex;gap:8px;margin-bottom:10px;">
                <button id="letter-sender-me"   onclick="setSender('me')"   style="flex:1;padding:9px;border-radius:10px;border:1.5px solid #ffb3c6;background:#ff6b9d;color:white;font-size:13px;font-weight:700;cursor:pointer;">나 (가나디)</button>
                <button id="letter-sender-miso" onclick="setSender('miso')" style="flex:1;padding:9px;border-radius:10px;border:1.5px solid #fce4ec;background:white;color:#bbb;font-size:13px;font-weight:700;cursor:pointer;">미소</button>
            </div>
            <div style="display:flex;gap:8px;">
                <textarea id="letter-input" rows="2" placeholder="편지를 써봐 💌"
                    style="flex:1;padding:12px;border:1.5px solid #fce4ec;border-radius:12px;font-size:15px;font-family:inherit;resize:none;outline:none;line-height:1.6;"></textarea>
                <button onclick="sendLetter()"
                    style="padding:0 18px;background:linear-gradient(135deg,#ff6b9d,#ff8fab);color:white;border:none;border-radius:12px;font-size:22px;cursor:pointer;">➤</button>
            </div>
        </div>
    </div>
</div>

<!-- 가나디 팝업 (전역) -->
<div class="ganadi-popup" id="ganadi-popup">
    <div class="ganadi-bubble" id="ganadi-bubble"></div>
    <div class="ganadi-svg-wrap ganadi-bounce" onclick="hideGanadiPopup()" id="ganadi-popup-svg"></div>
    <div class="ganadi-tap-hint">탭해서 닫기</div>
</div>


<div class="confetti-container" id="confetti-container"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// ══════════════════════════════════════════════════════
//  Firebase 설정 (본인 프로젝트 값으로 교체)
// ══════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
    apiKey:            "YOUR_API_KEY",
    authDomain:        "YOUR_PROJECT.firebaseapp.com",
    databaseURL:       "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId:         "YOUR_PROJECT",
    storageBucket:     "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId:             "YOUR_APP_ID"
};
let db = null;
try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
} catch(e) {}
</script>

<script>
// ══════════════════════════════════════════════════════
//  가나디 이미지
// ══════════════════════════════════════════════════════
const GANADI_IMG = {
    normal:   'ganadi_main.png',       // 기본 얼굴 (헤더, 일반)
    happy:    'ganadi_love.png',       // 손하트 (80%+ 점수)
    excited:  'ganadi_cheer.png',      // 팔 번쩍 (100%, 연속정답)
    sad:      'ganadi_sad.png',        // 엎드림 (40~59%)
    crying:   'ganadi_sad.png',        // 엎드림 (39% 이하)
    studying: 'ganadi_main.png',       // 집중 얼굴 (공부중)
    cheer:    'ganadi_main_cheer.png', // 응원 (격려 메시지)
    sleepy:   'ganadi_fat.png',        // 뚱뚱 앉기 (졸림/여유)
    skep:     'ganadi_skep.png',       // 의심 표정 (랜덤 팝업)
};

function ganadiSVG(mood = 'normal', size = 80) {
    const src = GANADI_IMG[mood] || GANADI_IMG.normal;
    return `<img src="${src}" width="${size}" style="display:block;object-fit:contain;" alt="가나디">`;
}

// ══════════════════════════════════════════════════════
//  가나디 팝업
// ══════════════════════════════════════════════════════
let popupTimer = null;

const STUDY_MESSAGES = [
    ['cheer',   '마 제대로 해라'],
    ['skep',    '자노?'],
    ['excited', '귀국해라'],
    ['sleepy',  '두쫀쿠 가온나'],
    ['cheer',   '아 똥마려'],
    ['skep',    '바람 피지'],
    ['happy',   '할렐야루 ㅋㅋ'],
    ['sleepy',  '김미소 뚱뚱이'],
    ['excited', '앙앙'],
];
let studyMsgIndex = 0;

function showGanadiPopup(mood, message) {
    clearTimeout(popupTimer);
    const popup = document.getElementById('ganadi-popup');
    const bubble = document.getElementById('ganadi-bubble');
    const svgWrap = document.getElementById('ganadi-popup-svg');
    bubble.textContent = message;
    svgWrap.innerHTML = ganadiSVG(mood, 80);
    popup.classList.add('show');
    popupTimer = setTimeout(hideGanadiPopup, 2200);
}

function hideGanadiPopup() {
    clearTimeout(popupTimer);
    document.getElementById('ganadi-popup').classList.remove('show');
}

// ══════════════════════════════════════════════════════
//  Default words (구글 시트에서 가져온 기본 단어들)
// ══════════════════════════════════════════════════════
function parseJapanese(text) {
    // "漢字（ふりがな）" 형태에서 일본어와 후리가나 분리
    const m = text.match(/^([^（(]+)[（(]([^）)]+)[）)]/);
    if (m) return { japanese: m[1].trim(), furigana: m[2].trim() };
    return { japanese: text.trim(), furigana: '' };
}

let words  = JSON.parse(localStorage.getItem('miso_words')  || 'null');
if (!words) {
    words = RAW_DEFAULT.map(([korean, jpRaw]) => ({
        ...parseJapanese(jpRaw), korean, memorized: false
    }));
    saveWords();
}
let stats  = JSON.parse(localStorage.getItem('miso_stats')  || '{"quizzes":0,"bestScore":0}');
let currentFilter = 'all';

let studyWords = [], studyIndex = 0, studyFlipped = false;
let quizWords  = [], quizIndex  = 0, quizCorrect  = 0, quizAnswered = false;

function saveWords()  { localStorage.setItem('miso_words',  JSON.stringify(words)); }
function saveStats()  { localStorage.setItem('miso_stats',  JSON.stringify(stats)); }

// ══════════════════════════════════════════════════════
//  Navigation
// ══════════════════════════════════════════════════════
function showPage(name, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    btn.classList.add('active');
    hideGanadiPopup();
    if (name === 'wordlist') renderWordList();
    if (name === 'study')    initStudy();
    if (name === 'quiz')     initQuiz();
    if (name === 'stats')    renderStats();
    if (name === 'letter')   initLetter();
}

// ══════════════════════════════════════════════════════
//  Word List
// ══════════════════════════════════════════════════════
function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderWordList();
}

function filteredWords() {
    if (currentFilter === 'memorized') return words.filter(w => w.memorized);
    if (currentFilter === 'active')    return words.filter(w => !w.memorized);
    return words;
}

function renderWordList() {
    const list = filteredWords();
    document.getElementById('word-count').textContent = `총 ${list.length}개 단어`;
    const el = document.getElementById('word-list');
    if (!list.length) {
        el.innerHTML = `<div class="empty-state"><div class="emoji">🌸</div><p>${currentFilter === 'all' ? '단어를 추가해보세요!' : '해당하는 단어가 없어요'}</p></div>`;
        return;
    }
    el.innerHTML = list.map(w => {
        const idx = words.indexOf(w);
        return `<div class="word-card ${w.memorized ? 'memorized' : ''}">
            <div class="word-info">
                ${w.furigana ? `<div class="word-furigana">${w.furigana}</div>` : ''}
                <div class="word-japanese">${w.japanese}</div>
                <div class="word-korean">${w.korean}</div>
            </div>
            <div class="word-actions">
                <button class="btn-icon btn-check ${w.memorized ? 'checked' : ''}" onclick="toggleMemo(${idx})" title="${w.memorized ? '학습중으로' : '암기완료'}">✓</button>
                <button class="btn-icon btn-delete" onclick="deleteWord(${idx})">🗑</button>
            </div>
        </div>`;
    }).join('');
}

function toggleMemo(i) {
    words[i].memorized = !words[i].memorized;
    saveWords();
    renderWordList();
    if (words[i].memorized) {
        setTimeout(() => showGanadiPopup('happy', '진짜 외웠다고 생각하나?'), 400);
    }
}

function deleteWord(i) {
    if (confirm(`"${words[i].japanese}" 단어를 삭제할까요?`)) {
        words.splice(i, 1);
        saveWords();
        renderWordList();
    }
}

// ══════════════════════════════════════════════════════
//  Add Word
// ══════════════════════════════════════════════════════
function addWord() {
    const jp = document.getElementById('input-japanese').value.trim();
    const fg = document.getElementById('input-furigana').value.trim();
    const kr = document.getElementById('input-korean').value.trim();
    if (!jp || !kr) { alert('일본어 단어와 한국어 뜻을 입력해주세요!'); return; }
    words.push({ japanese: jp, furigana: fg, korean: kr, memorized: false });
    saveWords();
    ['input-japanese','input-furigana','input-korean'].forEach(id => document.getElementById(id).value = '');

    const btn = document.getElementById('btn-add-word');
    const orig = btn.textContent;
    btn.textContent = '✅ 추가됐어요!';
    btn.style.background = 'linear-gradient(135deg,#4caf50,#66bb6a)';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1500);

    // 가나디 랜덤 등장 (5단어마다, 또는 랜덤 20%)
    if (words.length % 5 === 0) {
        setTimeout(() => showGanadiPopup('excited', `${words.length}개째 단어!! 대단한데?? 🔥`), 600);
    } else if (Math.random() < 0.2) {
        setTimeout(() => showGanadiPopup('cheer', '단어가 늘어나고 있어!! 화이팅!!'), 600);
    }

    document.getElementById('input-japanese').focus();
}

function bulkAddWords() {
    const text = document.getElementById('input-bulk').value.trim();
    if (!text) return;
    let added = 0;
    text.split('\n').forEach(line => {
        const parts = line.split(',').map(p => p.trim());
        if (parts.length === 3 && parts[0] && parts[2]) {
            words.push({ japanese: parts[0], furigana: parts[1], korean: parts[2], memorized: false });
            added++;
        } else if (parts.length === 2 && parts[0] && parts[1]) {
            words.push({ japanese: parts[0], furigana: '', korean: parts[1], memorized: false });
            added++;
        }
    });
    saveWords();
    document.getElementById('input-bulk').value = '';
    if (added > 0) {
        alert(`${added}개 단어가 추가됐어요! 🌸`);
        setTimeout(() => showGanadiPopup('excited', `${added}개나 외운다고?`), 500);
    }
}

// ══════════════════════════════════════════════════════
//  Study (Flashcard)
// ══════════════════════════════════════════════════════
function initStudy() {
    let pool = words.filter(w => !w.memorized);
    if (!pool.length) pool = [...words];
    studyWords = pool.sort(() => Math.random() - 0.5);
    studyIndex = 0;
    studyFlipped = false;
    studyMsgIndex = 0;
    renderStudy();
}

function renderStudy() {
    const el = document.getElementById('study-content');
    if (!words.length) {
        el.innerHTML = `<div class="empty-state"><div class="emoji">📚</div><p>먼저 단어를 추가해보세요!</p></div>`;
        return;
    }
    if (!studyWords.length) {
        el.innerHTML = `<div class="empty-state"><div class="emoji">🎉</div><p>쓰꾸삐?</p></div>`;
        setTimeout(() => showGanadiPopup('excited', '야르 ㅋㅋ'), 400);
        return;
    }
    const w = studyWords[studyIndex];
    const pct = ((studyIndex + 1) / studyWords.length) * 100;
    el.innerHTML = `
        <div class="counter-text">${studyIndex + 1} / ${studyWords.length}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="flashcard" onclick="flipStudy()">
            ${studyFlipped
                ? `<div style="font-size:13px;color:#aaa;margin-bottom:6px">${w.japanese}${w.furigana ? ' · ' + w.furigana : ''}</div>
                   <div class="card-korean" style="font-size:28px;font-weight:700;color:#222;margin-top:0">${w.korean}</div>
                   <div style="font-size:11px;color:#ddd;margin-top:20px">탭해서 다시 가리기</div>`
                : `<div class="card-furigana">${w.furigana || '　'}</div>
                   <div class="card-japanese">${w.japanese}</div>
                   <div style="font-size:13px;color:#ddd;margin-top:20px">탭해서 뜻 확인 👆</div>`
            }
        </div>
        <div style="text-align:center;margin-bottom:12px;">
            <button onclick="speakWord('${esc(w.japanese)}')"
                    style="background:#fff0f5;border:1.5px solid #ffb3c6;border-radius:24px;padding:10px 28px;font-size:15px;cursor:pointer;color:#ff6b9d;font-weight:600;">
                🔊 발음 듣기
            </button>
        </div>
        <div class="card-buttons">
            <button class="btn-secondary" style="background:#f5f5f5;color:#888" onclick="moveStudy(-1)">← 이전</button>
            <button class="btn-secondary" style="background:linear-gradient(135deg,#ff6b9d,#ff8fab);color:white" onclick="moveStudy(1)">다음 →</button>
        </div>
        <button class="btn-primary" onclick="initStudy()" style="background:linear-gradient(135deg,#a78bfa,#c084fc)">🔀 다시 섞기</button>`;
}

function flipStudy() { studyFlipped = !studyFlipped; renderStudy(); }

let _ttsAudio = null;
function speakWord(text) {
    if (_ttsAudio) { _ttsAudio.pause(); _ttsAudio = null; }
    const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=ja&client=tw-ob`;
    _ttsAudio = new Audio(url);
    _ttsAudio.play().catch(() => {
        if (!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = 'ja-JP';
        window.speechSynthesis.speak(utt);
    });
}

function moveStudy(dir) {
    studyIndex = (studyIndex + dir + studyWords.length) % studyWords.length;
    studyFlipped = false;
    renderStudy();
    // 5장마다 가나디 등장
    if (studyIndex > 0 && studyIndex % 5 === 0) {
        const [mood, msg] = STUDY_MESSAGES[studyMsgIndex % STUDY_MESSAGES.length];
        studyMsgIndex++;
        setTimeout(() => showGanadiPopup(mood, msg), 300);
    }
}

// ══════════════════════════════════════════════════════
//  Quiz
// ══════════════════════════════════════════════════════
function initQuiz() {
    let pool = words.filter(w => !w.memorized);
    if (pool.length < 4) pool = [...words];
    const el = document.getElementById('quiz-content');
    if (pool.length < 4) {
        el.innerHTML = `<div class="empty-state"><div class="emoji">🎯</div><p>퀴즈를 하려면<br>최소 4개 단어가 필요해요!</p></div>`;
        return;
    }
    const counts = [10, 20, 30, 50].filter(n => n <= pool.length);
    el.innerHTML = `
        <div class="section-title" style="margin-bottom:8px;">퀴즈 설정 🎯</div>
        <p style="font-size:14px;color:#aaa;margin-bottom:24px;">우웅 공주님 퀴즈 푸실 시간이에용~<br><span style="font-size:12px;">학습중인 단어 ${pool.length}개 중 랜덤 선택</span></p>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
            ${counts.map(n => `
            <button onclick="startQuiz(${n})"
                style="padding:22px 10px;background:linear-gradient(135deg,#fff0f5,#fce4ec);border:2px solid #ffb3c6;
                       border-radius:16px;font-size:22px;font-weight:700;color:#ff6b9d;cursor:pointer;">
                ${n}개
            </button>`).join('')}
        </div>
        <button onclick="startQuiz(${pool.length})"
            style="width:100%;padding:18px;background:linear-gradient(135deg,#ff6b9d,#ff8fab);
                   color:white;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;">
            전체 (${pool.length}개) 다 풀기
        </button>`;
}

function startQuiz(count) {
    let pool = words.filter(w => !w.memorized);
    if (pool.length < 4) pool = [...words];
    pool = pool.sort(() => Math.random() - 0.5);
    quizWords = pool.slice(0, count);
    quizIndex = 0; quizCorrect = 0; quizAnswered = false;
    streak = 0; wrongStreak = 0;
    renderQuiz();
}

function renderQuiz() {
    if (quizIndex >= quizWords.length) { showQuizResult(); return; }
    const w = quizWords[quizIndex];
    const pct = (quizIndex / quizWords.length) * 100;
    quizAnswered = false;
    const others = words.filter(x => x.korean !== w.korean).sort(() => Math.random() - 0.5).slice(0, 3);
    const opts = [w, ...others].sort(() => Math.random() - 0.5);
    document.getElementById('quiz-content').innerHTML = `
        <div class="counter-text">${quizIndex + 1} / ${quizWords.length}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="score-display">점수: ${quizCorrect} / ${quizIndex}</div>
        <div class="quiz-question">
            ${w.furigana ? `<div class="quiz-furigana">${w.furigana}</div>` : ''}
            <div class="quiz-word">${w.japanese}</div>
            <div class="quiz-sub">이 단어의 뜻은?</div>
        </div>
        <div class="quiz-options">
            ${opts.map(o => `<button class="quiz-option" onclick="answerQuiz(this,'${esc(o.korean)}','${esc(w.korean)}')">${o.korean}</button>`).join('')}
        </div>`;
}

function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

let streak = 0;
let wrongStreak = 0;
function answerQuiz(btn, selected, correct) {
    if (quizAnswered) return;
    quizAnswered = true;
    const isCorrect = selected === correct;
    document.querySelectorAll('.quiz-option').forEach(b => {
        b.disabled = true;
        if (b.textContent.trim() === correct) b.classList.add('correct');
        else if (b === btn) b.classList.add('wrong');
    });
    if (isCorrect) {
        quizCorrect++;
        streak++;
        wrongStreak = 0;
        // 맞을 때: 가나디(cheer/happy/excited) + 남자사진 중 랜덤
        const correctPool = [
            () => showGanadiPopup('cheer',   '야르 🌸'),
            () => showGanadiPopup('happy',   '좀 치노'),
            () => showGanadiPopup('excited', '쓰껄ㅋㅋ'),
            () => showGanadiPopup('cheer',   '앙앙'),
            () => showGanadiPopup('happy',   '미소는 축구 천재라네'),
           
        ];
        setTimeout(() => correctPool[Math.floor(Math.random() * correctPool.length)](), 200);
    } else {
        streak = 0;
        wrongStreak++;
        // 틀릴 때: 가나디(sad/skep) + 여자메롱 중 랜덤 (2연속이면 애니 추가)
        const wrongPool = [
            () => showGanadiPopup('sad',  '엥?? '),
            () => showGanadiPopup('skep', '개못하노 ㅋㅋ'),
            () => showGanadiPopup('sad',  '김미소 사원 즉시 귀국하도록'),
            () => showSpecialPopup('girl_merong.jpg', '메렁'),
        ];
        if (wrongStreak >= 2) {
            setTimeout(() => showSpecialPopup('anime.jpg', '볘에에'), 200);
            wrongStreak = 0;
        } else {
            setTimeout(() => wrongPool[Math.floor(Math.random() * wrongPool.length)](), 200);
        }
    }
    setTimeout(() => { quizIndex++; renderQuiz(); }, 1100);
}

function showQuizResult() {
    const total = quizWords.length;
    const pct = Math.round(quizCorrect / total * 100);
    stats.quizzes++;
    if (pct > stats.bestScore) stats.bestScore = pct;
    saveStats();

    let mood, msg;
    if (pct === 100) { mood = 'excited'; msg = '쓰껄 ㅋㅋ'; celebrate(); }
    else if (pct >= 80) { mood = 'happy';   msg = '할렐야루 ㅋㅋ'; celebrate(); }
    else if (pct >= 60) { mood = 'cheer';   msg = '야르 ㅋㅋ'; }
    else if (pct >= 40) { mood = 'sad';     msg = '엥?'; }
    else               { mood = 'crying';  msg = '접어라 ㅋㅋ'; }

    document.getElementById('quiz-content').innerHTML = `
        <div class="quiz-result">
            <div class="result-ganadi">
                ${ganadiSVG(mood, 110)}
            </div>
            <div class="result-score">${pct}%</div>
            <div class="result-fraction">${quizCorrect} / ${total} 정답</div>
            <div class="result-message">${msg}</div>
            <button class="btn-primary" onclick="startQuiz(${total})">🔄 같은 개수로 재도전!</button>
            <button class="btn-primary mt-12" onclick="initQuiz()" style="background:linear-gradient(135deg,#f97316,#fb923c)">🎯 개수 다시 설정</button>
            <button class="btn-primary mt-12" onclick="document.querySelector('[data-page=wordlist]').click()" style="background:linear-gradient(135deg,#a78bfa,#c084fc)">📖 단어장 보기</button>
        </div>`;
    streak = 0;
}

// ══════════════════════════════════════════════════════
//  Confetti
// ══════════════════════════════════════════════════════
function celebrate() {
    const c = document.getElementById('confetti-container');
    const colors = ['#ff6b9d','#ffb3c6','#ffd700','#a78bfa','#67e8f9','#86efac','#fb923c'];
    for (let i = 0; i < 90; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.cssText = `left:${Math.random()*100}vw;top:-12px;
            width:${Math.random()*10+5}px;height:${Math.random()*10+5}px;
            background:${colors[Math.floor(Math.random()*colors.length)]};
            border-radius:${Math.random()>.5?'50%':'3px'};
            animation-duration:${Math.random()*2+2}s;
            animation-delay:${Math.random()*1.2}s;`;
        c.appendChild(el);
    }
    setTimeout(() => c.innerHTML = '', 4500);
}

// ══════════════════════════════════════════════════════
//  Stats
// ══════════════════════════════════════════════════════
function renderStats() {
    const total = words.length;
    const mem   = words.filter(w => w.memorized).length;
    const pct   = total ? Math.round(mem/total*100) : 0;
    document.getElementById('stat-total').textContent     = total;
    document.getElementById('stat-memorized').textContent = mem;
    document.getElementById('stat-quizzes').textContent   = stats.quizzes;
    document.getElementById('stat-best').textContent      = stats.bestScore + '%';
    document.getElementById('stat-progress').style.width  = pct + '%';
    document.getElementById('stat-progress-text').textContent = `${mem} / ${total} (${pct}%)`;
}

function resetStats() {
    if (confirm('통계를 초기화할까요?')) {
        stats = { quizzes: 0, bestScore: 0 };
        saveStats();
        renderStats();
    }
}

// ══════════════════════════════════════════════════════
//  편지함
// ══════════════════════════════════════════════════════
let letterSender = 'me';
let letterListenerAttached = false;

const SENDER_INFO = {
    me:   { name: '가나디', avatar: 'ganadi_main.png' },
    miso: { name: '미소',   avatar: 'girl_merong.jpg'  },
};

function setSender(who) {
    letterSender = who;
    document.getElementById('letter-sender-me').style.background   = who === 'me'   ? '#ff6b9d' : 'white';
    document.getElementById('letter-sender-me').style.color        = who === 'me'   ? 'white'   : '#bbb';
    document.getElementById('letter-sender-miso').style.background = who === 'miso' ? '#ff6b9d' : 'white';
    document.getElementById('letter-sender-miso').style.color      = who === 'miso' ? 'white'   : '#bbb';
}

function initLetter() {
    if (!db) {
        document.getElementById('letter-list').innerHTML =
            `<div class="empty-state"><div class="emoji">⚠️</div><p>Firebase 설정이 필요해요.<br>코드 상단 FIREBASE_CONFIG를 채워주세요!</p></div>`;
        return;
    }
    if (letterListenerAttached) return;
    letterListenerAttached = true;
    db.ref('letters').orderByChild('ts').on('value', snap => {
        const items = [];
        snap.forEach(c => items.push({ key: c.key, ...c.val() }));
        renderLetters(items);
    });
}

function renderLetters(items) {
    const el = document.getElementById('letter-list');
    if (!items.length) {
        el.innerHTML = `<div class="empty-state"><div class="emoji">💌</div><p>첫 편지를 써봐!</p></div>`;
        return;
    }
    el.innerHTML = items.map(item => {
        const info = SENDER_INFO[item.sender] || SENDER_INFO.me;
        const time = new Date(item.ts).toLocaleString('ko-KR', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' });
        return `<div class="bubble-wrap ${item.sender}">
            <img class="bubble-avatar" src="${info.avatar}" alt="${info.name}">
            <div class="bubble-content">
                <span class="bubble-name">${info.name}</span>
                <div class="bubble">${item.text.replace(/</g,'&lt;')}</div>
                <div style="display:flex;align-items:center;gap:4px;">
                    <span class="bubble-time">${time}</span>
                    <button class="bubble-del" onclick="deleteLetter('${item.key}')">✕</button>
                </div>
            </div>
        </div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
}

function sendLetter() {
    const input = document.getElementById('letter-input');
    const text = input.value.trim();
    if (!text || !db) return;
    db.ref('letters').push({ sender: letterSender, text, ts: Date.now() });
    input.value = '';
}

function deleteLetter(key) {
    if (!db) return;
    db.ref('letters/' + key).remove();
}

// 편지 입력창 Shift+Enter 줄바꿈, Enter 전송
document.getElementById('letter-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendLetter(); }
});
